
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android Project
        run: |
          unzip -q JUNA_FF_TOOL_project.zip -d extracted
          test -f extracted/JunaFFTool/settings.gradle

      - name: Build APK
        run: |
          cd extracted/JunaFFTool
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JUNA-FF-TOOL-debug
          path: extracted/JunaFFTool/app/build/outputs/apk/debug/app-debug.apk
